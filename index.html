<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Enhanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe Enhanced</h1>

        <div class="game-modes">
            <button id="mode-toggle" class="mode-toggle">Switch to Single Player</button>
        </div>

        <div class="score-board">
            <div class="player-score">
                <h3>Player X</h3>
                <div class="score" id="score-x">0</div>
            </div>
            <div class="draws">
                <h3>Draws</h3>
                <div class="score" id="draws">0</div>
            </div>
            <div class="player-score">
                <h3>Player O</h3>
                <div class="score" id="score-o">0</div>
            </div>
        </div>

        <div class="game-info">
            <div class="player-turn">
                <h2>Player <span id="current-player">X</span>'s Turn</h2>
            </div>
            <div class="win-message" id="win-message">
                <h2 id="winner-text"></h2>
            </div>
        </div>

        <div class="game-board">
            <div class="cell" id="0"></div>
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
        </div>

        <div class="game-controls">
            <button id="restart-btn">Restart Game</button>
            <button id="reset-scores-btn">Reset Scores</button>
        </div>
    </div>

    <!-- Audio elements for sound effects -->
    <audio id="move-sound" src="move-sound.mp3" preload="auto"></audio>
    <audio id="win-sound" src="win-sound.mp3" preload="auto"></audio>
    <audio id="draw-sound" src="draw-sound.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
